<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Workout Log</title>
<link rel="manifest" href="manifest.webmanifest">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("workout-theme-v1")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<style>
:root{--bg:#0d1420;--panel:#172235;--panel2:#202e44;--text:#edf3fb;--muted:#9eacc0;--accent:#63d6a3;--line:#314158;--danger:#ff7777}
:root[data-theme="light"]{--bg:#f4f6f8;--panel:#ffffff;--panel2:#e8edf2;--text:#17212b;--muted:#5f6b78;--accent:#16865b;--line:#cbd3dc;--danger:#c93445}
:root[data-theme="light"] header,:root[data-theme="light"] nav{background:#ffffff}
:root[data-theme="light"] input,:root[data-theme="light"] select{background:#ffffff;color:var(--text)}
:root[data-theme="light"] .day.selected{background:#d9f0e5;border-color:var(--accent)}
:root[data-theme="light"] button.danger{background:#f9dfe2;color:#8b1725}
:root[data-theme="light"] .day.today{border-color:var(--accent)}
:root[data-theme="light"] #editDay,:root[data-theme="light"] #addExercise,:root[data-theme="light"] #saveDay,:root[data-theme="light"] #createExercise,:root[data-theme="light"] #exportData{background:#dcefe5;color:#28543e;border:1px solid #c5e2d2}
:root[data-theme="light"] #page-entry hr{border-top-color:#555}
:root[data-theme="light"] .calendar{gap:0}
:root[data-theme="light"] .calendar .dow,:root[data-theme="light"] .calendar .day{border:0;border-radius:0;box-shadow:inset 0 0 0 .5px var(--line)}
:root[data-theme="light"] .calendar .day.today{box-shadow:inset 0 0 0 2px var(--accent)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,"Noto Sans JP",sans-serif;padding-bottom:82px}
header{padding:18px 16px 12px;background:#101827;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:21px;margin:0;font-weight:750}.sub{color:var(--muted);font-size:12px;margin-top:3px}
main{max-width:720px;margin:auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#101827;border-top:1px solid var(--line);padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;border:0;background:none;color:var(--muted);font-size:12px;padding:7px 2px}nav button.active{color:var(--accent);font-weight:700}
button,.btn{border:0;border-radius:11px;background:var(--accent);color:#092017;font-weight:700;padding:11px 14px;font-size:14px;cursor:pointer}
button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
button.danger{background:#512b35;color:#ffdfe2}
button:disabled{opacity:.4}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.grow{flex:1;min-width:0}
label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}
input,select{width:100%;background:#0f1928;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px;min-width:0}
input[type=number]{appearance:textfield}input[type=number]::-webkit-inner-spin-button{appearance:none}
h2{font-size:17px;margin:4px 0 10px}h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted);font-size:13px}.tiny{font-size:11px;color:var(--muted)}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;color:var(--muted);font-size:11px;padding:5px 0}
.day{min-height:52px;border:1px solid var(--line);background:var(--panel);border-radius:10px;color:var(--text);padding:5px 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px}
.day.blank{visibility:hidden}.day.today{border-color:var(--accent)}.day.selected{background:#244738;border-color:var(--accent)}.dots{display:flex;align-items:center;justify-content:center;gap:3px;min-height:5px}.dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}.dot.event{background:#ff5555}
.pill{font-size:11px;background:var(--panel2);border-radius:20px;padding:4px 8px;color:var(--muted)}
.set-row{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1.35fr) 32px;gap:7px;align-items:center;margin:7px 0}
.rep-control{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;margin-top:4px}
.rep-control button{padding:5px 1px;font-size:11px;min-width:0;border-radius:7px}
.rep-wrap{min-width:0}
@media(min-width:560px){.rep-control button{font-size:12px;padding:6px}}
.set-row .num{text-align:center;color:var(--muted);font-size:13px}
.exercise-block{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.exercise-block:first-child{border:0;padding:0;margin:0}
.history-item{display:grid;grid-template-columns:90px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.hidden{display:none!important}.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{flex:1}
footer{color:var(--muted);font-size:11px;text-align:center;padding:20px}
@media(min-width:560px){.day{min-height:68px}.set-row{grid-template-columns:48px 1fr 1fr 38px}}
</style>
</head>
<body>
<header><h1>Workout Log</h1></header>
<main>
<section id="page-calendar">
 <div class="calendar-head"><button class="secondary" id="prevMonth">‹</button><h2 id="monthLabel"></h2><button class="secondary" id="nextMonth">›</button></div>
 <div class="calendar" id="calendar"></div>
 <div class="card">
  <div class="row between"><h2 id="selectedDateLabel">日付</h2><span class="pill" id="dayCount">0種目</span></div>
  <div id="daySummary" class="muted">日付を選択してください。</div>
  <button id="editDay" style="width:100%;margin-top:12px">この日の記録を入力・編集</button>
 </div>
</section>
<section id="page-entry" class="hidden">
 <div class="row between"><h2>トレーニング記録</h2><span class="pill" id="entryDateLabel"></span></div>
 <label for="entryDate">記録日</label><input type="date" id="entryDate">
 <label for="eventInput">イベント（任意）</label><input type="text" id="eventInput" placeholder="例：大会、出張、胸・肩の日">
 <hr style="border:0;border-top:1px solid #ffffff;margin:14px 0">
 <div id="entryList"></div>
 <div class="row" style="margin-top:12px"><select id="exerciseSelect" class="grow"><option value="">種目を選択</option></select><button id="addExercise">種目を追加</button></div>
 <div class="actions" style="margin-top:14px"><button id="saveDay" class="grow">記録を保存</button><button id="backCal" class="secondary">カレンダーへ</button></div>
</section>
<section id="page-history" class="hidden">
 <h2>種目別履歴</h2>
 <label>種目</label><select id="historyExercise"></select>
 <label>表示期間</label><select id="historyPeriod"><option value="1">直近1か月</option><option value="3">直近3か月</option><option value="6">直近6か月</option><option value="12">直近12か月</option><option value="all">全期間</option></select>
 <div id="historySummary" class="card"></div>
 <div class="card"><div class="row between"><h3 id="chartTitle">最大重量</h3><button id="chartModeButton" class="secondary" style="padding:7px 10px">表示切替</button></div><div class="muted" id="chartDescription" style="margin-bottom:8px">各日の最高重量（kg）</div><canvas id="maxChart" height="210" style="width:100%;display:block"></canvas><div id="chartEmpty" class="empty hidden">グラフに表示できる記録がありません。</div></div>
 <div id="historyList" class="card"></div>
</section>
<section id="page-settings" class="hidden">
 <h2>種目・重量設定</h2>
 <div class="card">
  <h3>種目を追加</h3><div class="row"><input id="newExerciseName" placeholder="例：ベンチプレス" class="grow"><button id="createExercise">追加</button></div>
 </div>
 <div id="exerciseSettings"></div>
 <div class="card">
  <h3>データのバックアップ</h3><p class="muted">JSON形式で全記録・種目設定を保存、または復元できます。</p>
  <div class="actions"><button id="exportData">バックアップを書き出す</button><button class="secondary" id="importButton">バックアップを読み込む</button></div>
  <input type="file" id="importFile" accept="application/json,.json" class="hidden">
 </div>
 <div class="card">
  <h3>表示モード</h3>
  <label for="themeSelect">テーマ</label>
  <select id="themeSelect"><option value="dark">ダークモード</option><option value="light">ライトモード</option></select>
 </div>
</section>
</main>
<nav>
 <button data-page="calendar" class="active">カレンダー</button><button data-page="entry">記録入力</button><button data-page="history">履歴</button><button data-page="settings">設定</button>
</nav>
<script>
const KEY='workout-log-v1',THEME_KEY='workout-theme-v1';
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let data=loadData(), selectedDate=todayISO(), viewDate=new Date(),lastCalendarTap=null;
let draft={};
function loadData(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.exercises)&&x.records){if(!x.events||typeof x.events!=='object')x.events={};return x}}catch(e){}return {exercises:[{id:'bench',name:'ベンチプレス',weights:[20,30,40,50,55,60,65,70,75,80,85,90,100]},{id:'squat',name:'スクワット',weights:[20,40,60,80,100,120,140,160]},{id:'deadlift',name:'デッドリフト',weights:[40,60,80,100,120,140,160,180]}],records:{},events:{}}}
function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const exById=id=>data.exercises.find(e=>e.id===id);
function isNumericWeight(w){return typeof w==='number'&&Number.isFinite(w)}
function weightLabel(w){const s=String(w).trim();return isNumericWeight(w)?s+' kg':s}
function orderedWeights(weights){return [...weights].sort((a,b)=>typeof a==='number'&&typeof b==='number'?a-b:typeof a==='number'?1:typeof b==='number'?-1:String(a).localeCompare(String(b),'ja'))}
let historyChartMode='weight';
function parseWeightCandidates(raw){
 const values=raw.split(',').map(x=>x.trim()).filter(x=>x!=='').map(x=>{
  const n=Number(x);return Number.isFinite(n)?(n>=0?n:null):x;
 }).filter(x=>x!==null);
 const unique=[];const seen=new Set();
 for(const v of values){const k=typeof v==='number'?'n:'+v:'s:'+v;if(!seen.has(k)){seen.add(k);unique.push(v)}}
 return unique.sort((a,b)=>typeof a==='number'&&typeof b==='number'?a-b:typeof a==='number'?-1:typeof b==='number'?1:String(a).localeCompare(String(b),'ja'));
}
function applySettingsInputs(){const root=document.getElementById('exerciseSettings');const updates=[];for(const e of data.exercises){const nameInput=root.querySelector(`[data-name="${e.id}"]`),weightInput=root.querySelector(`[data-weights="${e.id}"]`);if(!nameInput||!weightInput)continue;const name=nameInput.value.trim();if(!name){alert('種目名を入力してください');nameInput.focus();return false}updates.push({e,name,weights:parseWeightCandidates(weightInput.value)})}updates.forEach(x=>{x.e.name=x.name;x.e.weights=x.weights});return true}
function applyTheme(theme){const value=theme==='light'?'light':'dark';document.documentElement.dataset.theme=value;localStorage.setItem(THEME_KEY,value);document.querySelector('meta[name="theme-color"]').content=value==='light'?'#ffffff':'#101827';const select=document.getElementById('themeSelect');if(select)select.value=value;if(!document.getElementById('page-history').classList.contains('hidden'))renderHistory()}
document.getElementById('themeSelect').value=document.documentElement.dataset.theme||'dark';
document.getElementById('themeSelect').onchange=e=>applyTheme(e.target.value);
function showPage(p){const current=document.querySelector('main>section:not(.hidden)')?.id;if(current==='page-settings'&&p!=='settings'){if(!applySettingsInputs())return;persist()}document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));document.getElementById('page-'+p).classList.remove('hidden');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(p==='history')renderHistory();if(p==='settings')renderSettings();if(p==='entry')renderEntry()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
function renderCalendar(){
 const y=viewDate.getFullYear(),m=viewDate.getMonth();document.getElementById('monthLabel').textContent=`${y}年${m+1}月`;
 const c=document.getElementById('calendar');c.innerHTML=['日','月','火','水','木','金','土'].map(x=>`<div class="dow">${x}</div>`).join('');
 const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();
 for(let i=0;i<first;i++)c.insertAdjacentHTML('beforeend','<div class="day blank"></div>');
 for(let d=1;d<=last;d++){const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,hasWorkout=(data.records[iso]||[]).length>0,hasEvent=String(data.events?.[iso]||'').trim().length>0;
 const el=document.createElement('button');el.className='day'+(iso===selectedDate?' selected':'')+(iso===todayISO()?' today':'');el.innerHTML=`<span>${d}</span><span class="dots">${hasWorkout?'<span class="dot workout" title="トレーニング記録"></span>':''}${hasEvent?'<span class="dot event" title="イベント"></span>':''}</span>`;el.onclick=()=>{const isSelected=selectedDate===iso;selectedDate=iso;lastCalendarTap=null;renderCalendar();renderDaySummary();if(isSelected){document.getElementById('entryDate').value=iso;showPage('entry');renderEntry()}};c.appendChild(el)}
 renderDaySummary();
}
function renderDaySummary(){
 document.getElementById('selectedDateLabel').textContent=selectedDate.replaceAll('-','/');const rec=(data.records[selectedDate]||[]).filter(r=>exById(r.exerciseId)),event=String(data.events?.[selectedDate]||'').trim();
 document.getElementById('dayCount').textContent=rec.length+'種目';
 const eventHtml=event?`<div style="padding:7px 0;border-bottom:1px solid var(--line)"><b style="color:#ff7777">イベント</b><div class="muted">${esc(event)}</div></div>`:'';
 const recordsHtml=rec.map(r=>{const e=exById(r.exerciseId);return `<div style="padding:7px 0;border-bottom:1px solid var(--line)"><b>${esc(e?.name||'削除済み種目')}</b><div class="muted">${r.sets.map(s=>`${esc(weightLabel(s.weight))}×${s.reps}回`).join(' / ')}</div></div>`}).join('');
 document.getElementById('daySummary').innerHTML=eventHtml+recordsHtml||'この日の記録はありません。';
}
document.getElementById('prevMonth').onclick=()=>{viewDate.setMonth(viewDate.getMonth()-1);renderCalendar()};
document.getElementById('nextMonth').onclick=()=>{viewDate.setMonth(viewDate.getMonth()+1);renderCalendar()};
document.getElementById('editDay').onclick=()=>{showPage('entry');document.getElementById('entryDate').value=selectedDate;renderEntry()};
document.getElementById('backCal').onclick=()=>showPage('calendar');
document.getElementById('entryDate').onchange=e=>{selectedDate=e.target.value||todayISO();renderEntry()};
function renderEntry(){
 const date=document.getElementById('entryDate');if(!date.value)date.value=selectedDate;
 document.getElementById('entryDateLabel').textContent=date.value;
 document.getElementById('eventInput').value=String(data.events?.[date.value]||'');
 const sel=document.getElementById('exerciseSelect');sel.innerHTML='<option value="">種目を選択</option>'+data.exercises.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');sel.value='';
 const old=data.records[date.value]||[];draft=JSON.parse(JSON.stringify(old));
 renderDraft();
}
function renderDraft(){
 const root=document.getElementById('entryList');
 root.innerHTML=draft.map((r,idx)=>{const e=exById(r.exerciseId);if(!e)return '';return `<div class="card exercise-block"><div class="row between"><h3>${esc(e.name)}</h3><button class="danger" data-remove="${idx}" style="padding:7px 10px">種目を外す</button></div>
 ${r.sets.map((s,si)=>`<div class="set-row"><span class="num">${si+1}セット</span><select data-w="${idx},${si}">${orderedWeights(e.weights).map(w=>`<option value="${esc(String(w))}" ${String(s.weight)===String(w)?'selected':''}>${esc(weightLabel(w))}</option>`).join('')}</select><div class="rep-wrap"><input type="number" min="0" step="1" inputmode="numeric" placeholder="回数" value="${s.reps}" data-r="${idx},${si}"><div class="rep-control">${[[10,'+10'],[1,'+1'],[-1,'-1'],[-10,'-10']].map(([v,t])=>`<button type="button" class="secondary" data-adjust="${idx},${si},${v}">${t}</button>`).join('')}</div></div><button class="secondary" data-delset="${idx},${si}" style="padding:7px">×</button></div>`).join('')}
 <button class="secondary" data-addset="${idx}" style="width:100%;margin-top:6px">＋ セット追加</button></div>`}).join('');
 root.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{draft.splice(+b.dataset.remove,1);renderDraft()});
 root.querySelectorAll('[data-addset]').forEach(b=>b.onclick=()=>{const r=draft[+b.dataset.addset],last=r.sets[r.sets.length-1];r.sets.push({weight:last?.weight??(exById(r.exerciseId).weights[0]??0),reps:Number(last?.reps??0)});renderDraft()});
 root.querySelectorAll('[data-delset]').forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.delset.split(',').map(Number);draft[i].sets.splice(j,1);renderDraft()});
 root.querySelectorAll('[data-w]').forEach(el=>el.onchange=()=>{const [i,j]=el.dataset.w.split(',').map(Number);draft[i].sets[j].weight=exById(draft[i].exerciseId).weights.find(w=>String(w)===el.value)??el.value});
 root.querySelectorAll('[data-r]').forEach(el=>el.onchange=()=>{const [i,j]=el.dataset.r.split(',').map(Number);draft[i].sets[j].reps=Math.max(0,Math.floor(Number(el.value)||0))});
 root.querySelectorAll('[data-adjust]').forEach(b=>b.onclick=()=>{const [i,j,v]=b.dataset.adjust.split(',').map(Number);const input=root.querySelector(`[data-r="${i},${j}"]`);const next=Math.max(0,Math.floor(Number(input.value)||0)+v);input.value=next;draft[i].sets[j].reps=next});
}
function addSelectedExercise(){const sel=document.getElementById('exerciseSelect'),id=sel.value;if(!id)return;if(draft.some(r=>r.exerciseId===id)){alert('この種目はすでに追加されています');sel.value='';return}const e=exById(id);if(!e){sel.value='';return}const currentDate=document.getElementById('entryDate').value||selectedDate;const previous=Object.entries(data.records).filter(([d,rs])=>d<currentDate&&rs.some(r=>r.exerciseId===id)).sort((a,b)=>b[0].localeCompare(a[0]))[0];const previousRecord=previous?.[1].find(r=>r.exerciseId===id);if(!e.weights.length){alert('この種目は重量候補が未設定です。設定画面で重量候補を登録してください。');sel.value='';return}const priorSet=previousRecord?.sets?.[0];const defaultWeight=orderedWeights(e.weights)[0];const sets=[priorSet?{weight:e.weights.find(w=>String(w)===String(priorSet.weight))??defaultWeight,reps:Number(priorSet.reps)}:{weight:defaultWeight,reps:0}];draft.push({exerciseId:id,sets});renderDraft();sel.value=''}
document.getElementById('exerciseSelect').onchange=addSelectedExercise;document.getElementById('addExercise').onclick=addSelectedExercise;
document.getElementById('saveDay').onclick=()=>{const date=document.getElementById('entryDate').value;if(!date){alert('日付を指定してください');return}
 const normalized=draft.map(r=>({...r,sets:r.sets.filter(s=>Number(s.reps)>0).map(s=>({weight:isNumericWeight(s.weight)?Number(s.weight):String(s.weight),reps:Math.floor(Number(s.reps))}))})).filter(r=>r.sets.length);
 const event=String(document.getElementById('eventInput').value||'').trim();
 if(normalized.length)data.records[date]=normalized;else delete data.records[date];
 if(event){if(!data.events)data.events={};data.events[date]=event}else if(data.events)delete data.events[date];
 persist();selectedDate=date;viewDate=new Date(date+'T12:00:00');draft=JSON.parse(JSON.stringify(normalized));renderCalendar();renderEntry()};
function drawMaxChart(points){
 const mode=historyChartMode;
 const modeNames={weight:'最大重量',maxReps:'最高回数（セットごと）',totalReps:'合計回数（全セット）'};
 const units={weight:'kg',maxReps:'回',totalReps:'回'};
 document.getElementById('chartTitle').textContent=modeNames[mode];
 document.getElementById('chartDescription').textContent=mode==='weight'?'各日の最高重量（kg）':mode==='maxReps'?'各日の最高回数（1セットあたり）':'各日の合計回数（全セット）';

 const canvas=document.getElementById('maxChart'),empty=document.getElementById('chartEmpty'),ctx=canvas.getContext('2d');
 const dpr=window.devicePixelRatio||1,w=Math.max(280,canvas.clientWidth),h=210;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
 if(!points.length){canvas.classList.add('hidden');empty.classList.remove('hidden');return}canvas.classList.remove('hidden');empty.classList.add('hidden');
 const pad={l:42,r:12,t:14,b:34},pw=w-pad.l-pad.r,ph=h-pad.t-pad.b,vals=points.map(p=>p.value),dataMin=Math.min(...vals),dataMax=Math.max(...vals),rawRange=dataMax-dataMin,range=rawRange||Math.max(1,Math.abs(dataMax)*0.2),niceStep=range/4,power=Math.pow(10,Math.floor(Math.log10(niceStep))),fraction=niceStep/power,weightStep=(fraction<=1?1:fraction<=2?2:fraction<=5?5:10)*power,step=mode==='weight'?weightStep:Math.max(1,Math.ceil(range/4)),padding=Math.max(step*0.5,range*0.1),lo=Math.floor((dataMin-padding)/step)*step,hi=Math.ceil((dataMax+padding)/step)*step,x=i=>pad.l+(points.length===1?pw/2:i*pw/(points.length-1)),y=v=>pad.t+ph-(v-lo)/(hi-lo)*ph;

function renderHistory(){
 const sel=document.getElementById('historyExercise');const old=sel.value;sel.innerHTML=data.exercises.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');if(data.exercises.some(e=>e.id===old))sel.value=old;
 const id=sel.value,period=document.getElementById('historyPeriod').value;const cutoff=new Date();cutoff.setMonth(cutoff.getMonth()-Number(period));
 const rows=[];if(id)Object.entries(data.records).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([date,rs])=>{if(period!=='all'&&new Date(date+'T23:59:59')<cutoff)return;const r=rs.find(x=>x.exerciseId===id);if(r)rows.push({date,sets:r.sets})});
 const total=rows.reduce((n,r)=>n+r.sets.reduce((a,s)=>a+(isNumericWeight(s.weight)?Number(s.weight)*s.reps:0),0),0);
 const points=rows.map(r=>({date:r.date,weight:Math.max(0,...r.sets.filter(s=>isNumericWeight(s.weight)).map(s=>Number(s.weight))),maxReps:Math.max(0,...r.sets.map(s=>Number(s.reps)||0)),totalReps:r.sets.reduce((sum,s)=>sum+(Number(s.reps)||0),0)})).sort((a,b)=>a.date.localeCompare(b.date)).map(p=>({...p,value:p[historyChartMode==='weight'?'weight':historyChartMode==='maxReps'?'maxReps':'totalReps']}));
 document.getElementById('historySummary').innerHTML=`<b>${esc(exById(id)?.name||'種目')}</b><div class="muted" style="margin-top:6px">記録日数：${rows.length}日　／　総ボリューム：${Math.round(total).toLocaleString()} kg　／　最高重量：${points.length?Math.max(...points.map(p=>p.weight))+' kg':'—'}</div>`;
 drawMaxChart(points);document.getElementById('historyList').innerHTML=rows.length?rows.map(r=>`<div class="history-item"><b>${r.date.replaceAll('-','/')}</b><div>${r.sets.map((s,i)=>`${i+1}セット目 ${esc(weightLabel(s.weight))}${isNumericWeight(s.weight)?'':' ×'}${isNumericWeight(s.weight)?'×':''}${s.reps}回`).join('<br>')}</div></div>`).join(''):'<div class="empty">該当期間の記録はありません。</div>';
}
document.getElementById('chartModeButton').onclick=()=>{historyChartMode=historyChartMode==='weight'?'maxReps':historyChartMode==='maxReps'?'totalReps':'weight';renderHistory()};
document.getElementById('historyExercise').onchange=renderHistory;document.getElementById('historyPeriod').onchange=renderHistory;window.addEventListener('resize',()=>{if(!document.getElementById('page-history').classList.contains('hidden'))renderHistory()});

 const moveExercise=(id,delta)=>{if(!applySettingsInputs())return;persist();const card=root.querySelector(`[data-exup="${id}"],[data-exdown="${id}"]`)?.closest('.card');if(!card)return;const beforeTop=card.getBoundingClientRect().top;const i=data.exercises.findIndex(e=>e.id===id),j=i+delta;if(j<0||j>=data.exercises.length)return;[data.exercises[i],data.exercises[j]]=[data.exercises[j],data.exercises[i]];persist();renderSettings();requestAnimationFrame(()=>{const movedCard=root.querySelector(`[data-exup="${id}"],[data-exdown="${id}"]`)?.closest('.card');if(!movedCard)return;const adjustPosition=()=>{const deltaY=movedCard.getBoundingClientRect().top-beforeTop;if(Math.abs(deltaY)<1)return;let scroller=movedCard.parentElement;while(scroller&&scroller!==document.body&&scroller!==document.documentElement){const style=getComputedStyle(scroller);if(/auto|scroll|overlay/.test(style.overflowY)&&scroller.scrollHeight>scroller.clientHeight){scroller.scrollTop+=deltaY;return}scroller=scroller.parentElement}window.scrollBy(0,deltaY)};adjustPosition();requestAnimationFrame(adjustPosition)})};
 root.querySelectorAll('[data-exup]').forEach(b=>b.onclick=()=>moveExercise(b.dataset.exup,-1));
